<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${supportMode} ? 'Escribir a Soporte - Connectify' : 'Solicitud operativa - Connectify'">Solicitud</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/ui.css}">
    <style>
        .request-shell{max-width:980px;margin:0 auto}.request-hero{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:24px;align-items:center;margin-bottom:20px;padding:30px 32px;border-radius:18px;background:#171f31;color:#fff;box-shadow:0 20px 46px rgba(15,23,42,.14)}.request-hero h1{margin:14px 0 8px;color:#fff;font-size:2.35rem}.request-hero p{margin:0;color:rgba(255,255,255,.78)}.request-hero .badge{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}.request-mark{display:grid;place-items:center;min-height:112px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.08);font-size:2rem;font-weight:900}.request-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}.request-card,.request-guide{border:1px solid #e2e7ef;border-radius:14px;background:#fff;box-shadow:0 14px 34px rgba(15,23,42,.06)}.request-card{padding:24px}.request-card h2,.request-guide h2{margin:0 0 18px}.request-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.request-grid label{display:grid;gap:7px;color:#26324b;font-size:.79rem;font-weight:900}.request-grid .wide{grid-column:1/-1}.request-grid input,.request-grid select,.request-grid textarea{width:100%;box-sizing:border-box;border:1px solid #d7ddea;border-radius:8px;background:#fbfcfe;padding:11px 12px;color:#111827;font:inherit}.request-grid textarea{min-height:132px;resize:vertical}.request-card .btn{margin-top:18px}.request-guide{padding:22px}.guide-row{padding:13px 0;border-bottom:1px solid #edf0f5}.guide-row:last-of-type{border-bottom:0}.guide-row span{display:block;color:#667085;font-size:.75rem}.guide-row strong{display:block;margin-top:4px;color:#172033;font-size:.9rem}.request-note{margin-top:16px;padding:12px;border-radius:8px;background:#f4f6fb;color:#59657a;font-size:.78rem;line-height:1.5}@media(max-width:800px){.request-hero,.request-layout{grid-template-columns:1fr}.request-mark{display:none}}@media(max-width:560px){.request-grid{grid-template-columns:1fr}.request-card{padding:18px}}
    </style>
</head>
<body>
<header class="navbar dashboard-nav">
    <a class="brand brand-link" th:href="@{/communications}"><span class="logo">SO</span><div><strong>Connectify</strong><small th:text="${supportMode} ? 'Soporte al cliente' : 'Solicitud operativa'">Solicitud</small></div></a>
    <nav class="top-actions"><a class="btn secondary" th:href="${supportMode} ? @{/communications} : @{/communications(box='operations')}">Volver a bandeja</a><a class="btn secondary" th:href="@{/dashboard}">Dashboard</a></nav>
</header>

<main class="dashboard-page">
    <div class="request-shell">
        <section class="request-hero">
            <div><p class="badge" th:text="${supportMode} ? 'Atencion al cliente' : 'Coordinacion interna'">Solicitud</p><h1 th:text="${supportMode} ? 'Escribir a Soporte' : 'Solicitud operativa'">Solicitud operativa</h1><p th:text="${supportMode} ? 'Registra una consulta sobre compras, tickets QR o acceso.' : 'Coordina una tarea concreta entre los roles que participan en el evento.'">Descripcion</p></div>
            <div class="request-mark" th:text="${supportMode} ? 'BM' : 'SO'">SO</div>
        </section>

        <section class="request-layout">
            <form class="request-card" th:action="@{/communications}" method="post">
                <h2 th:text="${supportMode} ? 'Datos de la consulta' : 'Datos de la solicitud'">Datos</h2>
                <div class="request-grid" th:if="${supportMode}">
                    <input type="hidden" name="senderEmail" th:value="${senderEmail}"><input type="hidden" name="senderRole" value="CLIENT"><input type="hidden" name="targetRole" value="ADMIN"><input type="hidden" name="type" value="CUSTOMER_SUPPORT"><input type="hidden" name="priority" value="NORMAL">
                    <label>Nombre<input name="senderName" type="text" placeholder="Tu nombre" required></label>
                    <label>Email<input type="email" th:value="${senderEmail}" readonly></label>
                    <label class="wide">Asunto<input name="subject" type="text" placeholder="Ej. No encuentro mi ticket QR" required></label>
                    <label class="wide">Mensaje<textarea name="body" placeholder="Describe lo ocurrido e incluye los datos que ayuden a revisar tu caso." required></textarea></label>
                </div>
                <div class="request-grid" th:unless="${supportMode}">
                    <label>Remitente<input name="senderName" type="text" placeholder="Nombre del responsable" required></label>
                    <label>Email<input name="senderEmail" type="email" th:value="${senderEmail}" required></label>
                    <label>Rol remitente<select name="senderRole" required><option th:each="role : ${roles}" th:value="${role}" th:text="${role}" th:selected="${role == senderRole}">ADMIN</option></select></label>
                    <label>Rol destinatario<select name="targetRole" required><option th:each="role : ${roles}" th:value="${role}" th:text="${role}">ORGANIZER</option></select></label>
                    <label>Tipo de solicitud<select name="type" required><option th:each="type : ${types}" th:value="${type}" th:text="${type}">GENERAL_COORDINATION</option></select></label>
                    <label>Prioridad<select name="priority" required><option th:each="priority : ${priorities}" th:value="${priority}" th:text="${priority}">NORMAL</option></select></label>
                    <label class="wide">Evento relacionado<select name="relatedEventId"><option value="">Sin evento relacionado</option><option th:each="event : ${events}" th:value="${event.id}" th:text="${event.title}">Evento</option></select></label>
                    <label class="wide">Asunto<input name="subject" type="text" placeholder="Ej. Corregir la portada del evento" required></label>
                    <label class="wide">Indicaciones<textarea name="body" placeholder="Describe la solicitud, el responsable y el resultado esperado." required></textarea></label>
                </div>
                <button class="btn primary full" type="submit" th:text="${supportMode} ? 'Enviar a Soporte' : 'Registrar solicitud'">Enviar</button>
            </form>

            <aside class="request-guide">
                <h2 th:text="${supportMode} ? 'Destino' : 'Ruta de trabajo'">Ruta</h2>
                <div class="guide-row"><span>Canal</span><strong th:text="${supportMode} ? 'Cliente a Soporte' : 'Coordinacion entre roles'">Canal</strong></div>
                <div class="guide-row"><span>Registro</span><strong>Queda guardado en la bandeja</strong></div>
                <div class="guide-row"><span>Seguimiento</span><strong>Estado y prioridad visibles</strong></div>
                <p class="request-note" th:text="${supportMode} ? 'Usa este canal para compras, entradas QR o dificultades de acceso.' : 'Esta solicitud no es un chat. Sirve para dejar una tarea clara y trazable.'">Nota</p>
            </aside>
        </section>
    </div>
</main>
</body>
</html>

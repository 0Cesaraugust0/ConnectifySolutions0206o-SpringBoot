<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar evento - Organizador</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/ui.css}">
    <link rel="stylesheet" th:href="@{/css/organizer.css}">
    <style>
        .edit-shell{max-width:980px;margin:0 auto}.edit-card{background:#fff;border:1px solid #e8eaf2;border-radius:22px;padding:24px;box-shadow:0 18px 45px rgba(15,23,42,.06)}.edit-note{margin:0 0 18px;color:#667085;font-size:.92rem}.save-row{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:20px}.save-row .btn{min-width:190px}@media(max-width:640px){.save-row{flex-direction:column;align-items:stretch}.save-row .btn{width:100%;text-align:center}}
    </style>
</head>
<body>
<header class="navbar dashboard-nav">
    <a class="brand brand-link" th:href="@{/dashboard/organizer/events}">
        <span class="logo">C</span><div><strong>Connectify</strong><small>Organizador</small></div>
    </a>
    <nav class="top-actions">
        <a class="btn secondary" th:href="@{/dashboard/organizer/events}">Mis eventos</a>
        <a class="btn secondary" th:href="@{/dashboard/organizer/events/{id}(id=${event.id})}">Ver detalle</a>
    </nav>
</header>

<main class="dashboard-page">
    <section class="organizer-hero">
        <p class="badge" th:text="${event.status}">PENDING_REVIEW</p>
        <h1>Editar evento</h1>
        <p class="hero-text">Actualiza la informacion comercial del evento. Al guardar, la propuesta vuelve a revision administrativa.</p>
    </section>

    <section class="edit-shell">
        <form class="edit-card" th:action="@{/dashboard/organizer/events/{id}/edit(id=${event.id})}" method="post">
            <p class="edit-note">Usa este ajuste cuando Administracion devuelva, observe o despublique el evento para correccion.</p>
            <div class="field-grid">
                <label class="wide">Titulo comercial
                    <input class="search-input" name="title" type="text" th:value="${event.title}" required>
                </label>
                <label class="wide">Descripcion del evento
                    <textarea class="search-input" name="description" rows="5" required th:text="${event.description}">Descripcion</textarea>
                </label>
                <label>Categoria
                    <select class="search-input" name="categoryId" required>
                        <option value="">Selecciona categoria</option>
                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:selected="${event.category != null && category.id == event.category.id}"
                                th:text="${category.name}">Categoria</option>
                    </select>
                </label>
                <label>Fecha y hora
                    <input class="search-input" name="eventDate" type="datetime-local" th:value="${event.eventDate != null ? #temporals.format(event.eventDate, 'yyyy-MM-dd''T''HH:mm') : ''}" required>
                </label>
                <label>Ubicacion
                    <input class="search-input" name="location" type="text" th:value="${event.location}" required>
                </label>
                <label>Ciudad
                    <input class="search-input" name="city" type="text" th:value="${event.city}" required>
                </label>
                <label>Capacidad total
                    <input class="search-input" name="capacity" type="number" min="1" th:value="${event.capacity}" required>
                </label>
                <label>Precio desde S/
                    <input class="search-input" name="price" type="number" min="0" step="0.01" th:value="${event.price}" required>
                </label>
                <label class="wide">URL de imagen principal
                    <input class="search-input" name="imageUrl" type="url" th:value="${event.imageUrl}" placeholder="https://.../portada-evento.jpg">
                </label>
            </div>
            <div class="save-row">
                <a class="btn secondary compact" th:href="@{/dashboard/organizer/events/{id}(id=${event.id})}">Cancelar</a>
                <button class="btn primary compact" type="submit">Guardar y enviar a revision</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
